<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PII Shield Guard</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #E2E8F0;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 10px;
      color: #64748B;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #065F46;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .scanner-box {
      margin-bottom: 12px;
    }
    .scanner-label {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
    textarea {
      width: 100%;
      height: 70px;
      box-sizing: border-box;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      font-family: monospace;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: #0F172A;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #0F172A;
      color: white;
      text-align: center;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #1E293B;
    }
    .result {
      margin-top: 8px;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="width: 24px; height: 24px; background: #0F172A; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px;">
      🛡️
    </div>
    <div>
      <div class="title">PII Shield Guard</div>
      <div class="subtitle">Real-time Form & Input Protection</div>
    </div>
  </div>

  <div class="badge">
    <span>●</span>
    <span>Active Input Monitoring Enabled</span>
  </div>

  <div class="scanner-box">
    <label class="scanner-label">Quick Scan Input:</label>
    <textarea id="scan-input" placeholder="Type text with cards, emails, or phone numbers..."></textarea>
    <div id="scan-result" class="result">0 sensitive entities detected.</div>
  </div>

  <button class="btn" id="open-app-btn">Open Full PII Shield App</button>

  <script src="popup.js"></script>
</body>
</html>
